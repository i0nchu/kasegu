# EPR15 research replication: same coins and 297 USDT notional as the frozen research run
# (git tag alpha-epr15-v1). For backtests, scripts/epr15_compare.py and shadow comparison only.
# NOT a recommended live setting: 40 coins x 297 USDT needs a large account.
# For a small account start from configs/epr15.example.yaml. See docs/epr15.md.
mode: paper

# the 40 research coins; trim for a small account, the rule itself is per coin
symbols: [
  BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT, DOGEUSDT, ADAUSDT, AVAXUSDT, LINKUSDT,
  DOTUSDT, LTCUSDT, BCHUSDT, TRXUSDT, SUIUSDT, 1000PEPEUSDT, WIFUSDT, ARBUSDT, OPUSDT,
  APTUSDT, NEARUSDT, TIAUSDT, INJUSDT, SEIUSDT, ENAUSDT, 1000BONKUSDT, FETUSDT, ORDIUSDT,
  WLDUSDT, 1000FLOKIUSDT, AAVEUSDT, ATOMUSDT, CRVUSDT, ETCUSDT, FILUSDT, HBARUSDT, JUPUSDT,
  ONDOUSDT, PENDLEUSDT, UNIUSDT, XLMUSDT,
]

timeframe: 1m

# frozen: any other value is refused at startup
strategy:
  id: epr15
  k: 12            # limit = ask x (1 - 12 x vol%), vol% = (ATR60 / close + mean amplitude60) / 2
  ema_period: 240  # orders only while the 1m close is below EMA240, long only
  vol_period: 60
  reference: ask

# frozen: fixed 3% stop (also on the exchange) and a market exit 15 minutes after the fill
exit:
  policy: time_only
  stop_loss_pct: 3.0
  max_holding_minutes: 15
  # tier settings are ignored by time_only

risk:
  # 30 x 10 x 0.99 = 297 USDT notional per trade, as in the research
  margin_budget: 30
  leverage: 10
  max_leverage: 10
  max_symbol_notional: 300  # one 297 USDT position per coin, no account cap, as in the research
  max_account_loss: 0       # off, as in the research
  max_loss_per_trade: 0     # off, as in the research
  max_spread_pct: 0.05
  min_quote_qty: 0.0
  stale_after_s: 10
  cost_reserve_pct: 1.0
  max_daily_loss: 0         # off, as in the research
  max_consecutive_losses: 0
  loss_pause_min: 60

fee:
  maker: 0.0002
  taker: 0.0005
  slippage_pct: 0.02
  use_account_rate: false

exchange:
  testnet: true
  data_testnet: false
  history_bars: 1500        # EMA240 needs 720 bars, more bars = less seed bias
  heartbeat_s: 30

paper:
  balance: 1000

live:
  auto_cancel_s: 0
  keepalive_min: 30

backtest:
  start: 2026-10-01
  end: 2026-10-07
  cache_dir: data/history
  out_dir: data/backtests

alerts:
  min_level: warning
  telegram: false
  webhook_url: ""
  webhook_min_level: info
  events_path: data/events-epr15-research.jsonl

db_path: data/journal-epr15-research.db
status_path: data/status-epr15-research.json
