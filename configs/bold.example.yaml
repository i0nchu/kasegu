# One-shot leveraged bet to double the stake, PAPER ONLY (research/alpha/mgrid-bold).
#   cp configs/bold.example.yaml configs/bold.yaml
#   uv run kasegu --mode bold-paper --config configs/bold.yaml
# Expected: about half the tries double, the rest end at 10% of the stake. Expected value ~0 minus costs.
symbol: BTCUSDT
side: 1              # 1 long, -1 short
stake: 100.0         # USD per try, every try starts again from the stake
leverage: 10         # price +10.2% -> 2x equity, price -8.8% -> 0.1x
target: 2.0          # equity multiple to take profit
bust: 0.1            # equity multiple to stop out (before liquidation)
max_days: 30         # close at market after this
taker: 0.0005
slip: 0.0005
maintenance: 0.004   # the config is rejected if the stop would come after liquidation
out_dir: data/bold
