[project]
name = "kasegu"
version = "0.1.0"
description = "Volatility trading system for Binance USDS-M Futures"
readme = "README.md"
authors = [
    { name = "i0nchu" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "binance-sdk-derivatives-trading-usds-futures>=18.0.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
kasegu = "kasegu.__main__:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
