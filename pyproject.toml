[project]
name = "kasegu"
version = "0.1.0"
description = "Volatility trading strategy research"
readme = "README.md"
authors = [
    { name = "i0nchu" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
kasegu = "kasegu:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
