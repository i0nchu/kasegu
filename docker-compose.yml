# Setup:
#   cp configs/config.example.yaml configs/config.yaml   # strategy, symbols, risk
#   cp .env.example .env                                 # mode, API keys, alerts
#   docker compose up -d --build
#   docker compose logs -f
services:
  kasegu:
    build: .
    image: kasegu:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data  # journal db, status.json, events.jsonl, cache
    # time for the shutdown to cancel entry orders after `docker compose stop`
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # Trend-aligned martingale grid, paper only (docs/mgrid.md). Not started by default:
  #   cp configs/mgrid.example.yaml configs/mgrid.yaml
  #   docker compose --profile grid up -d --build kasegu-grid
  kasegu-grid:
    profiles: ["grid"]
    image: kasegu:local
    build: .
    restart: unless-stopped
    command: ["--mode", "grid-paper", "--config", "configs/mgrid.yaml"]
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data  # data/grid: state.json, trades.csv, decisions.jsonl, daily.csv
    healthcheck:
      test: ["CMD", "python", "-m", "kasegu.health", "data/grid/status.json", "900"]
      interval: 60s
      timeout: 5s
      start_period: 300s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # One-shot leveraged bet to double the stake, paper only (docs/bold.md). Not started by default:
  #   cp configs/bold.example.yaml configs/bold.yaml
  #   docker compose --profile bold up -d --build kasegu-bold
  kasegu-bold:
    profiles: ["bold"]
    image: kasegu:local
    build: .
    restart: unless-stopped
    command: ["--mode", "bold-paper", "--config", "configs/bold.yaml"]
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data  # data/bold: state.json, tries.csv, status.json
    healthcheck:
      test: ["CMD", "python", "-m", "kasegu.health", "data/bold/status.json", "900"]
      interval: 60s
      timeout: 5s
      start_period: 300s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
